spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - departements
    properties:
      departements:
        type: array
        description: >-
          Codes département injectés dans le paramètre "departement". Commencer
          par ["91"], puis ["75","77","78","91","92","93","94","95"].
        items:
          type: string
        order: 0
        title: Départements à extraire
        default:
          - "91"
      etat_administratif:
        type: string
        description: A = actives uniquement (recommandé pour le dashboard), C = cessées.
        enum:
          - A
          - C
        order: 1
        title: État administratif
        default: A
    additionalProperties: true

