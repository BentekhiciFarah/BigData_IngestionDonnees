version: 6.44.0

type: DeclarativeSource

description: >
  Source API Recherche d'entreprises (api.gouv.fr) — unités légales de l'ESS
  actives, partitionnées par département, pour dépôt en couche Bronze (MinIO).

check:
  type: CheckStream
  stream_names:
    - API ESS -> Airbyte

streams:
  - type: DeclarativeStream
    name: API ESS -> Airbyte
    retriever:
      type: SimpleRetriever
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: per_page
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: page
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 25
          cursor_value: "{{ response.page + 1 }}"
          stop_condition: "{{ response.page >= response.total_pages or response.page >= 400 }}"
      requester:
        type: HttpRequester
        url: https://recherche-entreprises.api.gouv.fr/search
        http_method: GET
        error_handler:
          type: CompositeErrorHandler
          error_handlers:
            - type: DefaultErrorHandler
              max_retries: 8
              response_filters:
                - type: HttpResponseFilter
                  action: RETRY
                  http_codes:
                    - 429
                  error_message: Rate limit API Recherche d'entreprises (429)
              backoff_strategies:
                - type: WaitTimeFromHeader
                  header: Retry-After
                - type: ExponentialBackoffStrategy
                  factor: 5
            - type: DefaultErrorHandler
              max_retries: 5
              response_filters:
                - type: HttpResponseFilter
                  action: RETRY
                  http_codes:
                    - 500
                    - 502
                    - 503
                    - 504
                  error_message: Erreur serveur API Recherche d'entreprises
              backoff_strategies:
                - type: ExponentialBackoffStrategy
                  factor: 5
        request_headers:
          Accept: application/json
        request_parameters:
          est_ess: "true"
          include: siege,complements,matching_etablissements
          minimal: "true"
          etat_administratif: "{{ config['etat_administratif'] }}"
          limite_matching_etablissements: "100"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
      partition_router:
        type: ListPartitionRouter
        values: "{{ config['departements'] }}"
        cursor_field: department
        request_option:
          type: RequestOption
          field_name: departement
          inject_into: request_parameter
    primary_key:
      - siren
      - extract_department
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
          - siren
          - extract_department
