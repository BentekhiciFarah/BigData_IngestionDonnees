              - "null"
          amount:
            type:
              - number
              - "null"
          accountId:
            type:
              - string
              - "null"
          closeDate:
            type:
              - string
              - "null"
          leadSource:
            type:
              - string
              - "null"
          accountName:
            type:
              - string
              - "null"
          probability:
            type:
              - number
              - "null"
          amountCurrency:
            type:
              - string
              - "null"
        additionalProperties: true
  - type: DeclarativeStream
    name: contacts
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url: "{{ config['base_url'] }}/api/v1/Contact"
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        request_parameters:
          order: asc
          select: >-
            id,salutationName,firstName,lastName,title,accountId,accountName,emailAddress,phoneNumber,addressCity,addressPostalCode,addressCountry,description
          orderBy: id
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - list
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/schema#
        required:
