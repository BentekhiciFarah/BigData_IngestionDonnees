version: 7.28.2

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - accounts

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: ApiKeyAuthenticator
        api_token: "{{ config['api_key'] }}"
        inject_into:
          type: RequestOption
          field_name: X-Api-Key
          inject_into: header
      request_headers:
        Accept: application/json
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: maxSize
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
        pagination_strategy:
          type: OffsetIncrement
          page_size: 10
          inject_on_first_request: true

streams:
  - type: DeclarativeStream
    name: accounts
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url: "{{ config['base_url'] }}/api/v1/Account"
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        request_parameters:
          order: asc
          select: >-
            id,name,type,industry,siren,emailAddress,phoneNumber,website,billingAddressStreet,billingAddressCity,billingAddressPostalCode,billingAddressState,billingAddressCountry,description
          orderBy: id
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - list
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        properties:
          type:
            type:
              - string
              - "null"
          description:
            type:
              - string
              - "null"
          id:
            type: string
          name:
            type:
              - string
              - "null"
          siren:
            type:
              - string
              - "null"
          website:
            type:
              - string
              - "null"
          industry:
            type:
              - string
              - "null"
          phoneNumber:
            type:
              - string
              - "null"
          emailAddress:
            type:
              - string
              - "null"
          billingAddressCity:
            type:
              - string
              - "null"
          billingAddressState:
            type:
              - string
              - "null"
          billingAddressStreet:
            type:
              - string
              - "null"
          billingAddressCountry:
            type:
              - string
              - "null"
          billingAddressPostalCode:
            type:
              - string
              - "null"
        additionalProperties: true
  - type: DeclarativeStream
    name: opportunities
    retriever:
      type: SimpleRetriever
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url: "{{ config['base_url'] }}/api/v1/Opportunity"
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        request_headers:
          $ref: "#/definitions/linked/HttpRequester/request_headers"
        request_parameters:
          order: asc
          select: >-
            id,name,accountId,accountName,stage,amount,amountCurrency,probability,closeDate,leadSource,description
          orderBy: id
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - list
    primary_key: id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        type: object
        $schema: http://json-schema.org/draft-07/schema#
        properties:
          description:
            type:
              - string
              - "null"
          id:
            type: string
          name:
            type:
              - string
              - "null"
          stage:
            type:
