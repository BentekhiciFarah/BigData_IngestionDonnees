spec:
  type: Spec
  connection_specification:
    type: object
    title: EspoCRM - associations
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - base_url
      - api_key
    properties:
      api_key:
        type: string
        order: 1
        title: Clé API EspoCRM
        airbyte_secret: true
      base_url:
        type: string
        description: Adresse accessible depuis Airbyte, sans barre finale ni /api/v1.
        order: 0
        title: URL de base EspoCRM

